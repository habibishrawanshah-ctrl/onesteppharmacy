{% extends "base.html" %}
{% block title %}Order Placed - OneStep Pharmacy{% endblock %}
{% block content %}
<section class="order-success">
  <div class="success-card">
    <div class="success-icon">
      <i data-lucide="check" width="32" height="32" stroke-width="2.5"></i>
    </div>
    <h2>Order Placed Successfully</h2>
    <p>Thank you for your order. We will process it shortly and keep you updated.</p>
    <a class="btn btn-primary" href="{% url 'products:list' %}">
      Continue Shopping
      <i data-lucide="arrow-right" width="16" height="16" stroke-width="2.5"></i>
    </a>
  </div>
</section>
{% endblock %}
