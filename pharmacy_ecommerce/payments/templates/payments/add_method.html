{% extends 'base.html' %}
{% block title %}Add Payment Method{% endblock %}
{% block content %}
<div class="form-page">
  <div class="form-card">
    <h2>Add Payment Method</h2>
    <p class="form-card-desc">Save a payment method for faster checkout</p>
    <form method="post">
      {% csrf_token %}

      <div class="form-group">
        <label class="form-label" for="method_type">Payment Method</label>
        <select name="method_type" id="method_type" class="form-select" required>
          <option value="">Select...</option>
          <option value="credit_card">Credit / Debit Card</option>
          <option value="bank_transfer">Bank Transfer</option>
          <option value="khalti">Khalti</option>
          <option value="esewa">eSewa</option>
          <option value="connectIPS">ConnectIPS</option>
          <option value="mobile_banking">Mobile Banking</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="account_name">Account Holder Name</label>
        <input type="text" name="account_name" id="account_name" class="form-input" placeholder="Full name on account">
      </div>

      <div class="form-group">
        <label class="form-label" for="account_number">Account / Card Number</label>
        <input type="text" name="account_number" id="account_number" class="form-input" placeholder="Account or card number">
      </div>

      <div class="form-group">
        <label class="form-label" for="bank_name">Bank / Provider Name</label>
        <input type="text" name="bank_name" id="bank_name" class="form-input" placeholder="e.g. NMB Bank, Khalti">
      </div>

      <div class="checkbox-group">
        <input type="checkbox" name="is_default" id="is_default">
        <label class="form-label" for="is_default" style="margin-bottom:0;">Set as default payment method</label>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Save Method</button>
    </form>
    <div class="form-card-back">
      <a href="{% url 'payments:methods' %}">Back to payment methods</a>
    </div>
  </div>
</div>
{% endblock %}
