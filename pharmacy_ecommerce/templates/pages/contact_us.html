{% extends 'base.html' %}
{% load static %}
{% block title %}Contact Us - OneStep Pharmacy{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Contact Us</h1>
  <p>We would love to hear from you</p>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:var(--space-5);">
  <div class="card" style="padding:var(--space-6);border-radius:var(--radius-lg);">
    <div class="d-flex align-center gap-3 mb-4">
      <i data-lucide="mail" width="24" height="24"></i>
      <h3 class="fw-700" style="font-size:1rem;">Email</h3>
    </div>
    <p class="text-secondary text-sm">habibishrawanshah@gmail.com</p>
  </div>
  <div class="card" style="padding:var(--space-6);border-radius:var(--radius-lg);">
    <div class="d-flex align-center gap-3 mb-4">
      <i data-lucide="phone" width="24" height="24"></i>
      <h3 class="fw-700" style="font-size:1rem;">Phone</h3>
    </div>
    <p class="text-secondary text-sm">+977-1-4XXXXXX</p>
  </div>
  <div class="card" style="padding:var(--space-6);border-radius:var(--radius-lg);">
    <div class="d-flex align-center gap-3 mb-4">
      <i data-lucide="map-pin" width="24" height="24"></i>
      <h3 class="fw-700" style="font-size:1rem;">Visit</h3>
    </div>
    <p class="text-secondary text-sm">Kathmandu, Nepal</p>
  </div>
</div>
{% endblock %}
