{% extends "base.html" %}
{% block title %}Login - OneStep Pharmacy{% endblock %}
{% block content %}
<section class="form-page">
  <div class="form-card">
    <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:24px;">
      <div style="width:56px;height:56px;background:var(--primary-50);border-radius:16px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary-500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h2>Welcome Back</h2>
      <p style="margin-bottom:0;">Sign in to your account to place orders</p>
    </div>
    <form method="post">
      {% csrf_token %}
      {% if request.GET.next %}<input type="hidden" name="next" value="{{ request.GET.next }}">{% endif %}
      {{ form.as_p }}
      <button class="btn btn-primary btn-block" type="submit">
        Sign In
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </form>
    <p class="text-center mt-4" style="font-size:0.88rem;color:var(--text-secondary);">
      Don't have an account? <a href="{% url 'users:signup' %}" style="color:var(--primary-500);font-weight:600;text-decoration:none;">Sign Up</a>
    </p>
  </div>
</section>
{% endblock %}
