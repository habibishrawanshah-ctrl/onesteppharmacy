{% extends "base.html" %}
{% block title %}Logout - OneStep Pharmacy{% endblock %}
{% block content %}
<section class="form-page">
  <div class="form-card">
    <h2>Sign Out</h2>
    <p class="form-card-desc">Are you sure you want to sign out?</p>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button class="btn btn-primary btn-block" type="submit">Sign Out</button>
    </form>
    <div class="form-card-back">
      <a href="/">Stay signed in</a>
    </div>
  </div>
</section>
{% endblock %}
