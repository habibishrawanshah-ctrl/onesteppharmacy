{% extends "base.html" %}
{% block title %}Sign Up - OneStep Pharmacy{% endblock %}
{% block content %}
<section class="form-page">
  <div class="form-card">
    <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:24px;">
      <div style="width:56px;height:56px;background:var(--primary-50);border-radius:16px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></svg>
      </div>
      <h2>Create Account</h2>
      <p style="margin-bottom:0;">Join OneStep Pharmacy to start ordering</p>
    </div>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary btn-block" type="submit">
        Create Account
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </form>
    <p class="text-center mt-4" style="font-size:0.88rem;color:var(--muted);">
      Already have an account? <a href="{% url 'login' %}" style="color:var(--primary);font-weight:600;text-decoration:none;">Sign In</a>
    </p>
  </div>
</section>
{% endblock %}
