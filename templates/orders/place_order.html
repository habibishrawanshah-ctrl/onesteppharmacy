{% extends 'base.html' %}
{% block title %}Place Order - ONE STEP PHARMACY{% endblock %}
{% block content %}
  <div class="form-page">
    <div class="form-card">
      <h2>Place Order</h2>
      <p>You are ordering <strong>{{ product.name }}</strong>. Enter the quantity below and confirm your purchase.</p>
      <form method="post">{% csrf_token %}
        <label for="quantity">Quantity</label>
        <input type="number" name="quantity" id="quantity" value="1" min="1">
        <button class="button button-primary">Place Order</button>
      </form>
    </div>
  </div>
{% endblock %}
