{% extends 'base.html' %}
{% block title %}Login - ONE STEP PHARMACY{% endblock %}
{% block content %}
  <div class="form-page">
    <div class="form-card">
      <h2>Login</h2>
      <p class="card-copy">Enter your email and password to access your pharmacy dashboard.</p>
      <form method="post">{% csrf_token %}
        {{ form.as_p }}
        <button class="button button-primary">Login</button>
      </form>
    </div>
  </div>
{% endblock %}
